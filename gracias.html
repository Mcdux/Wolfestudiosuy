<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias - Wolf Estudios</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(145deg, rgba(4,18,8,0.82) 0%, rgba(8,13,20,0.72) 46%, rgba(4,16,6,0.88) 100%),
        url('assets/gracias_wallpaper_red_blue.png') center / cover no-repeat;
      color: #dde4e8;
      font-family: 'Barlow', sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 560px);
      min-height: 260px;
      padding: 34px 26px;
      border: 1px solid rgba(221,228,232,0.12);
      border-radius: 18px;
      background: rgba(8,13,20,0.34);
      backdrop-filter: blur(18px) saturate(135%);
      box-shadow: 0 18px 54px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-family: 'Bebas Neue', 'Barlow Condensed', sans-serif;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 0.95;
      text-transform: uppercase;
      color: #7ecb8a;
      margin-bottom: 14px;
      letter-spacing: 0;
    }
    p {
      max-width: 420px;
      color: rgba(200,230,205,0.78);
      line-height: 1.7;
      margin-bottom: 26px;
      font-size: 14px;
    }
    a {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #08131f;
      background: linear-gradient(135deg, #e8b560, #c9933a);
      text-decoration: none;
      padding: 14px 34px;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,147,58,0.3);
    }
  </style>
</head>
<body>
  <main>
    <h1>Mensaje enviado</h1>
    <p>Gracias por escribirnos. Te respondemos en menos de 24hs!</p>
    <a href="https://wolfestudios.uy/">Volver a Wolf Estudios</a>
  </main>
</body>
</html>
